name: marinboysalon

services:
  redis:
    image: redis:7.4-alpine
    container_name: marinboy-salon-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - marinboy-salon-redis-data:/data

volumes:
  marinboy-salon-redis-data:
