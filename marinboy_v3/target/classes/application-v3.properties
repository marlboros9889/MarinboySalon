# v3 실행 예: --spring.profiles.active=v3
# JWT_SECRET은 32바이트 이상 Base64 인코딩 값을 운영 환경변수로 반드시 주입합니다.
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# React Vite 개발 서버의 v3 API 호출만 허용합니다.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
# OAuth2 성공 후 React가 서버 세션을 JWT로 교환할 개발 주소입니다.
app.react.redirect-uri=${REACT_APP_URL:http://127.0.0.1:5173}
