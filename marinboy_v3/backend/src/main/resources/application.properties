spring.application.name=marinboy-v3
# React 개발 서버의 기본 연결 주소와 동일하게 유지하며 배포 환경은 SERVER_PORT로 교체합니다.
server.port=${SERVER_PORT:8082}
# 별도 배포 프로필이 없으면 Git에서 제외한 local 설정으로 개발 DB에 연결합니다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Oracle XE: 로컬 개발 환경에서 관리하는 ORACLE_* 환경 변수를 사용합니다.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}

# MyBatis
mybatis.type-aliases-package=com.marinboy.dto
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 수업의 JPA Repository와 MyBatis를 병행할 때 테이블 자동 변경은 하지 않습니다.
spring.jpa.hibernate.ddl-auto=none
# API 응답 이후의 지연 조회를 막아 서비스 계층 밖 DB 접근을 방지합니다.
spring.jpa.open-in-view=false
# Redis는 JWT 블랙리스트 템플릿 용도이므로 Repository 자동 탐색을 비활성화합니다.
spring.data.redis.repositories.enabled=false

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Logging
logging.level.com.marinboy=info
logging.level.org.mybatis=warn
logging.level.org.apache.ibatis=warn
logging.level.org.springframework.jdbc=warn

# Kakao OAuth2 (Kakao Developers REST API key)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Google은 OpenID Connect 표준 속성(sub, name, email)을 사용해 고객 계정을 식별합니다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Naver는 응답 정보가 response 객체 안에 담기므로 provider user-name 속성을 명시합니다.
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,mobile
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Admin service image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# 관리자 예약 알림 메일은 환경 변수로 명시적으로 활성화한 경우에만 발송합니다.
app.notification.mail-enabled=${NOTIFICATION_MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase 모바일 인증은 서비스 계정이 준비된 환경에서만 활성화합니다.
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Swagger REST API 문서
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
