spring.application.name=marinboy-v3
# React 개발 서버의 기본 연결 주소와 동일하게 유지하며 배포 환경은 SERVER_PORT로 교체합니다.
server.port=${SERVER_PORT:8082}
# 별도 배포 프로필이 없으면 Git에서 제외한 local 설정으로 개발 DB에 연결합니다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# v3는 자체 JWT 인증만 사용하므로 임시 in-memory 사용자와 생성 비밀번호를 만들지 않습니다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Oracle XE: 로컬 개발 환경에서 관리하는 ORACLE_* 환경 변수를 사용합니다.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}

# MyBatis
mybatis.type-aliases-package=com.marinboy.dto
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 수업의 JPA Repository와 MyBatis를 병행할 때 테이블 자동 변경은 하지 않습니다.
spring.jpa.hibernate.ddl-auto=none
# API 응답 이후의 지연 조회를 막아 서비스 계층 밖 DB 접근을 방지합니다.
spring.jpa.open-in-view=false
# Redis는 JWT 블랙리스트 템플릿 용도이므로 Repository 자동 탐색을 비활성화합니다.
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# v3는 모든 보호 API에서 같은 JWT 설정을 사용하며, 서명키는 실행 환경에서 반드시 주입합니다.
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Logging
logging.level.com.marinboy=info
logging.level.org.mybatis=warn
logging.level.org.apache.ibatis=warn
logging.level.org.springframework.jdbc=warn

# Admin service image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
# 실행 폴더가 바뀌어도 같은 파일을 사용하도록 사용자 홈 아래의 고정 경로를 기본값으로 사용합니다.
# UPLOAD_DIRECTORY를 지정할 때도 반드시 절대 경로를 사용합니다.
app.upload.directory=${UPLOAD_DIRECTORY:${user.home}/.marinboy/uploads}

# 관리자 예약 알림 메일은 환경 변수로 명시적으로 활성화한 경우에만 발송합니다.
app.notification.mail-enabled=${NOTIFICATION_MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Calendar 연동은 키 파일과 캘린더 ID가 준비된 운영자 환경에서만 활성화합니다.
app.google-calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.google-calendar.calendar-id=${GOOGLE_CALENDAR_ID:}
app.google-calendar.credentials-path=${GOOGLE_CALENDAR_CREDENTIALS_PATH:}

# Swagger REST API 문서
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
