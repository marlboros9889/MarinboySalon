spring:
  application:
    name: marinboy-salon-back
  profiles:
    # 소셜 로그인 설정을 모든 실행 환경에서 읽되, 키 값은 환경변수로만 받습니다.
    include: oauth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/marinboy_salon?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${BACK_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.marinboy
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

app:
  front-url: ${FRONT_URL:http://localhost:3000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}"
  jwt:
    secret: ${JWT_SECRET:marinboy-salon-local-secret-key-change-before-production-2026}
    access-token-exp-seconds: ${JWT_ACCESS_EXP:1800}
    refresh-token-exp-seconds: ${JWT_REFRESH_EXP:604800}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    allow-weak-local-secret: ${JWT_ALLOW_WEAK_LOCAL:true}
  google-calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    calendar-id: ${GOOGLE_CALENDAR_ID:}
    credentials-path: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
  upload:
    # 운영에서는 SERVICE_IMAGE_DIRECTORY로 외부 저장 폴더를 지정합니다.
    service-image-directory: ${SERVICE_IMAGE_DIRECTORY:${user.dir}/uploads/service-items}

logging:
  level:
    com.marinboy: INFO
    com.marinboy.reservation: INFO
