# 애플리케이션 기본 이름과 실행 포트입니다.
spring.application.name=MarinboySalon_v2
server.port=8080
# 자체 세션 로그인을 사용하므로 사용하지 않는 임시 Spring Security 비밀번호 생성을 끕니다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Controller가 반환한 화면 이름 앞뒤에 JSP 경로를 붙입니다.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 한글 요청과 응답이 깨지지 않도록 UTF-8을 사용합니다.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# 비밀번호는 코드에 직접 적지 않고 환경 변수로 전달합니다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marinboy_salon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dto는 짧은 별칭으로 사용하고 Mapper XML은 하위 폴더까지 모두 찾습니다.
# 상위 패키지를 기준으로 찾아서 도메인 폴더가 늘어나도 설정 경로가 깨지지 않게 합니다.
mybatis.type-aliases-package=com.marinboy
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JSP 파일을 수정했을 때 개발 중 변경 내용을 바로 확인합니다.
server.servlet.jsp.init-parameters.development=true
