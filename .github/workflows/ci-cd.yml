name: Marinboy CI CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 백엔드 테스트와 JAR 생성
        working-directory: MarinboySalon_v3/back
        run: |
          chmod +x gradlew
          ./gradlew test bootJar
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MarinboySalon_v3/front/package-lock.json
      - name: 프론트 의존성 설치
        working-directory: MarinboySalon_v3/front
        run: npm ci
      - name: 프론트 테스트
        working-directory: MarinboySalon_v3/front
        run: npm test -- --runInBand
      - name: 프론트 운영 빌드
        working-directory: MarinboySalon_v3/front
        env:
          NEXT_PUBLIC_API_URL: /backend
          INTERNAL_API_URL: http://127.0.0.1:8082
          NEXT_PUBLIC_SOCIAL_LOGIN_ENABLED: 'false'
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: SSH 키 등록
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      - name: EC2 호스트 키 등록
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -n "$EC2_HOST"
      - name: EC2에 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          tar --exclude=.git --exclude=back/build --exclude=front/node_modules --exclude=front/.next -C MarinboySalon_v3 -czf /tmp/marinboy-release.tar.gz .
          scp /tmp/marinboy-release.tar.gz "$EC2_USER@$EC2_HOST:/tmp/marinboy-release-$RELEASE_ID.tar.gz"
          ssh "$EC2_USER@$EC2_HOST" "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          APP_DIR=/opt/marinboy/app/MarinboySalon_v3
          RELEASE_DIR=/opt/marinboy/releases/$RELEASE_ID
          ARCHIVE=/tmp/marinboy-release-$RELEASE_ID.tar.gz
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          rsync -a --delete --exclude=.git --exclude=back/build --exclude=front/node_modules --exclude=front/.next "$RELEASE_DIR/" "$APP_DIR/"
          cd "$APP_DIR/back"
          chmod +x gradlew
          ./gradlew bootJar
          cd "$APP_DIR/front"
          npm ci
          NEXT_PUBLIC_API_URL=/backend INTERNAL_API_URL=http://127.0.0.1:8082 NEXT_PUBLIC_SOCIAL_LOGIN_ENABLED=false npm run build
          sudo systemctl restart marinboy-back marinboy-front
          sleep 5
          curl --fail --silent --show-error http://127.0.0.1:8082/actuator/health > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          REMOTE_SCRIPT
