name: Marinboy CI CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 백엔드 테스트와 JAR 생성
        working-directory: MarinboySalon_v3/back
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test bootJar
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MarinboySalon_v3/front/package-lock.json
      - name: 프론트 의존성 설치
        working-directory: MarinboySalon_v3/front
        run: npm ci
      - name: 프론트 테스트
        working-directory: MarinboySalon_v3/front
        run: npm test -- --runInBand
      - name: 프론트 운영 빌드
        working-directory: MarinboySalon_v3/front
        env:
          NEXT_PUBLIC_API_URL: /backend
          INTERNAL_API_URL: http://127.0.0.1:8082
          NEXT_PUBLIC_SOCIAL_LOGIN_ENABLED: 'false'
        run: npm run build

      - name: 배포 결과물 압축
        run: tar -C MarinboySalon_v3 -czf marinboy-runtime.tar.gz back/build/libs front/.next

      - name: 배포 결과물 보관
        uses: actions/upload-artifact@v4
        with:
          name: marinboy-runtime
          path: marinboy-runtime.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, marinboy-ec2]
    environment: production
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: 검증된 빌드 결과물 받기
        uses: actions/download-artifact@v4
        with:
          name: marinboy-runtime
          path: runtime
      - name: EC2에 배포
        run: |
          set -euo pipefail
          APP_DIR=/opt/marinboy/app/MarinboySalon_v3
          RELEASE_DIR="$GITHUB_WORKSPACE/MarinboySalon_v3"
          # 실행 중인 Node.js 의존성은 서버에 유지하고, 소스와 검증된 결과물만 갱신합니다.
          rsync -a --exclude=.git --exclude=back/build --exclude=front/node_modules --exclude=front/.next "$RELEASE_DIR/" "$APP_DIR/"
          tar -xzf "$GITHUB_WORKSPACE/runtime/marinboy-runtime.tar.gz" -C "$APP_DIR"
          sudo systemctl restart marinboy-back marinboy-front
          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:8082/actuator/health > /dev/null && curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "서비스 기동 시간 초과" >&2
          exit 1
